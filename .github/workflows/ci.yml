name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get install --yes libchromaprint-tools
        timeout-minutes: 5
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest --cov=music_processor --cov-branch --cov-fail-under=80
      - run: python -m mypy --ignore-missing-imports src
      - run: python -m pip_audit --skip-editable
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: music-processor --help
