name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest --cov=music_processor --cov-branch --cov-fail-under=80
      - run: python -m mypy --ignore-missing-imports src
      - run: python -m pip_audit --skip-editable
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: music-processor --help
