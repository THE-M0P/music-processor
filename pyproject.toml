[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "music-upload-processor"
version = "0.1.0"
description = "Identify, clean, tag, and organise uploaded music files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "musicbrainzngs>=0.7.1,<1",
    "mutagen>=1.47,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
music-processor = "music_processor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_processor"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["‘", "’", "–", "⧸"]
